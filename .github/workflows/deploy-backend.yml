name: Deploy Backend

# Manual only: Actions tab -> "Deploy backend" -> Run workflow
on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
  VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
  # Baked into the build (CORS origin, social redirects). Override with a repo variable SITE_DOMAIN.
  NEXT_PUBLIC_VERCEL_PROJECT_PRODUCTION_URL: ${{ vars.SITE_DOMAIN || 'vital-sandbox.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - run: vercel build --prod --token=$VERCEL_TOKEN

      - run: vercel deploy --prebuilt --prod --archive=tgz --token=$VERCEL_TOKEN
